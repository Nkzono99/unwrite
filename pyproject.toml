[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unwrite"
version = "0.1.0"
description = "Break AI-written paper drafts into paragraph memos, laid as comments into a manuscript skeleton for a human to write"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
unwrite = "unwrite.cli:main"

[tool.setuptools]
packages = ["unwrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
